<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Garden Builder🌱</title>

    <style>
        /* =========================================================
           GARDEN BUILDER — FOUNDATION
           ========================================================= */

        :root {
            --panel-width: 250px;
            --topbar-height: 64px;
            --bottom-height: 52px;

            --bg: #17131d;
            --panel: #211b29;
            --panel-light: #2c2436;
            --border: #51435f;

            --text: #f4ecf8;
            --muted: #b8aabd;

            --accent: #b98bd4;
            --accent-dark: #805c9a;

            --canvas-bg: #8fcf78;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
        }

        body {
            font-family:
                system-ui,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;

            background: var(--bg);
            color: var(--text);
        }


        /* =========================================================
           APP SHELL
           ========================================================= */

        #garden-builder {
            width: 100%;
            height: 100%;
            display: grid;

            grid-template-columns:
                var(--panel-width)
                minmax(0, 1fr)
                var(--panel-width);

            grid-template-rows:
                var(--topbar-height)
                minmax(0, 1fr)
                var(--bottom-height);
        }


        /* =========================================================
           TOP BAR
           ========================================================= */

        #topbar {
            grid-column: 1 / -1;

            display: flex;
            align-items: center;
            gap: 18px;

            padding: 0 18px;

            background: var(--panel);

            border-bottom: 1px solid var(--border);

            box-shadow:
                0 3px 12px rgba(0, 0, 0, 0.25);

            z-index: 100;
        }

        #brand {
            display: flex;
            align-items: center;
            gap: 10px;

            min-width: 180px;

            font-weight: 800;
            font-size: 18px;
        }

        #brand span:first-child {
            font-size: 25px;
        }


        /* =========================================================
           SEASON SELECTOR
           ========================================================= */

        #season-selector {
            display: flex;
            align-items: center;
            gap: 6px;

            flex: 1;

            overflow-x: auto;
        }

        .season-button {
            appearance: none;
            border: 1px solid var(--border);

            background: var(--panel-light);
            color: var(--muted);

            padding: 8px 13px;

            border-radius: 8px;

            font: inherit;
            font-size: 13px;
            font-weight: 700;

            cursor: pointer;

            white-space: nowrap;

            transition:
                background 0.15s ease,
                color 0.15s ease,
                border-color 0.15s ease;
        }

        .season-button:hover {
            color: var(--text);
            border-color: var(--accent);
        }

        .season-button.active {
            color: white;
            background: var(--accent-dark);
            border-color: var(--accent);
        }


        /* =========================================================
           SIDE PANELS
           ========================================================= */

        .side-panel {
            min-width: 0;
            min-height: 0;

            display: flex;
            flex-direction: column;

            background: var(--panel);

            overflow: hidden;
        }

        #asset-panel {
            border-right: 1px solid var(--border);
        }

        #properties-panel {
            border-left: 1px solid var(--border);
        }


        .panel-header {
            flex: 0 0 auto;

            padding: 13px 15px;

            border-bottom: 1px solid var(--border);

            font-size: 13px;
            font-weight: 800;

            text-transform: uppercase;
            letter-spacing: 0.08em;

            color: var(--muted);
        }

        .panel-content {
            flex: 1;

            min-height: 0;

            overflow-y: auto;

            padding: 12px;
        }


        /* =========================================================
           ASSET LIBRARY
           ========================================================= */

        #asset-search {
            width: 100%;

            padding: 9px 10px;

            margin-bottom: 12px;

            border: 1px solid var(--border);
            border-radius: 7px;

            background: #151119;
            color: var(--text);

            font: inherit;
            font-size: 13px;

            outline: none;
        }

        #asset-search:focus {
            border-color: var(--accent);
        }

        .asset-category {
            margin-bottom: 15px;
        }

        .asset-category-title {
            margin-bottom: 7px;

            font-size: 11px;
            font-weight: 800;

            text-transform: uppercase;
            letter-spacing: 0.08em;

            color: var(--muted);
        }

        .asset-grid {
            display: grid;

            grid-template-columns:
                repeat(2, minmax(0, 1fr));

            gap: 7px;
        }

        .asset-item {
            position: relative;

            min-width: 0;
            aspect-ratio: 1;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 7px;

            background: #17131d;

            border: 1px solid var(--border);
            border-radius: 7px;

            cursor: grab;

            overflow: hidden;
        }

        .asset-item:hover {
            border-color: var(--accent);
            background: #241c2b;
        }

        .asset-item:active {
            cursor: grabbing;
        }

        .asset-item img {
            width: 100%;
            height: 100%;

            object-fit: contain;

            image-rendering: pixelated;
            image-rendering: crisp-edges;

            pointer-events: none;
        }

        .asset-name {
            position: absolute;

            left: 3px;
            right: 3px;
            bottom: 3px;

            padding: 2px 4px;

            background: rgba(0, 0, 0, 0.7);

            border-radius: 3px;

            font-size: 9px;
            line-height: 1.2;

            text-align: center;

            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;

            pointer-events: none;
        }


        /* =========================================================
           CANVAS AREA
           ========================================================= */

        #workspace {
            position: relative;

            min-width: 0;
            min-height: 0;

            overflow: hidden;

            background:
                radial-gradient(
                    ellipse at center,
                    #302a38 0%,
                    #17131d 100%
                );
        }

        #workspace-toolbar {
            position: absolute;

            top: 12px;
            left: 50%;

            transform: translateX(-50%);

            z-index: 50;

            display: flex;
            align-items: center;
            gap: 5px;

            padding: 5px;

            background: rgba(25, 19, 30, 0.92);

            border: 1px solid var(--border);
            border-radius: 9px;

            box-shadow:
                0 5px 18px rgba(0, 0, 0, 0.3);
        }

        .tool-button {
            appearance: none;

            border: 0;
            border-radius: 6px;

            background: transparent;
            color: var(--muted);

            padding: 7px 9px;

            font: inherit;
            font-size: 12px;
            font-weight: 700;

            cursor: pointer;
        }

        .tool-button:hover {
            color: white;
            background: var(--panel-light);
        }


        /* =========================================================
           GARDEN WORLD
           ========================================================= */

        #canvas-viewport {
            position: absolute;

            inset: 0;

            display: flex;
            align-items: center;
            justify-content: center;

            overflow: auto;

            padding: 70px 40px 40px;
        }

        #garden-canvas {
            position: relative;

            width: 1000px;
            height: 700px;

            flex: 0 0 auto;

            background: var(--canvas-bg);

            border: 2px solid #62556c;

            box-shadow:
                0 12px 35px rgba(0, 0, 0, 0.4);

            overflow: hidden;

            transform-origin: center center;
        }

        /*
         * Temporary visual guides.
         * We'll eventually replace this with the actual
         * gardening-page garden-world background.
         */

        #garden-canvas::before {
            content: "";

            position: absolute;
            inset: 0;

            background:
                linear-gradient(
                    rgba(255,255,255,0.05) 1px,
                    transparent 1px
                ),
                linear-gradient(
                    90deg,
                    rgba(255,255,255,0.05) 1px,
                    transparent 1px
                );

            background-size: 25px 25px;

            pointer-events: none;
        }

        #canvas-label {
            position: absolute;

            top: 50%;
            left: 50%;

            transform: translate(-50%, -50%);

            color: rgba(255,255,255,0.5);

            font-size: 18px;
            font-weight: 800;

            pointer-events: none;

            user-select: none;
        }


        /* =========================================================
           SELECTED SPRITES
           ========================================================= */

        .garden-object {
            position: absolute;

            transform-origin: center center;

            cursor: move;

            user-select: none;
            touch-action: none;
        }

        .garden-object img {
            display: block;

            width: 100%;
            height: 100%;

            object-fit: contain;

            image-rendering: pixelated;
            image-rendering: crisp-edges;

            pointer-events: none;
        }

        .garden-object.selected {
            outline: 1px dashed white;

            filter:
                drop-shadow(0 0 2px rgba(255,255,255,0.8));
        }


        /* =========================================================
           PROPERTIES PANEL
           ========================================================= */

        #no-selection {
            color: var(--muted);

            font-size: 13px;
            line-height: 1.5;

            text-align: center;

            padding: 30px 12px;
        }

        .property-group {
            margin-bottom: 16px;
        }

        .property-label {
            display: flex;
            justify-content: space-between;

            margin-bottom: 6px;

            color: var(--muted);

            font-size: 11px;
            font-weight: 700;
        }

        .property-value {
            color: var(--text);
        }

        .property-input {
            width: 100%;

            padding: 7px 8px;

            background: #151119;

            color: var(--text);

            border: 1px solid var(--border);
            border-radius: 6px;

            font: inherit;
            font-size: 12px;
        }

        .property-row {
            display: grid;

            grid-template-columns: 1fr 1fr;

            gap: 7px;
        }

        .property-button-row {
            display: grid;

            grid-template-columns: 1fr 1fr;

            gap: 7px;
        }

        .property-button {
            padding: 8px 6px;

            border: 1px solid var(--border);
            border-radius: 6px;

            background: var(--panel-light);
            color: var(--text);

            font: inherit;
            font-size: 11px;
            font-weight: 700;

            cursor: pointer;
        }

        .property-button:hover {
            border-color: var(--accent);
        }

        .danger-button:hover {
            border-color: #c86c6c;
            color: #ffaaaa;
        }


        /* =========================================================
           BOTTOM BAR
           ========================================================= */

        #bottom-bar {
            grid-column: 1 / -1;

            display: flex;
            align-items: center;
            justify-content: space-between;

            gap: 12px;

            padding: 8px 14px;

            background: var(--panel);

            border-top: 1px solid var(--border);

            z-index: 100;
        }

        #viewport-buttons {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .viewport-button {
            appearance: none;

            border: 1px solid var(--border);
            border-radius: 6px;

            background: var(--panel-light);
            color: var(--muted);

            padding: 6px 9px;

            font: inherit;
            font-size: 11px;
            font-weight: 700;

            cursor: pointer;
        }

        .viewport-button.active {
            color: white;
            border-color: var(--accent);
        }

        #bottom-actions {
            display: flex;
            gap: 7px;
        }

        .primary-button {
            appearance: none;

            border: 1px solid var(--accent);
            border-radius: 7px;

            background: var(--accent-dark);
            color: white;

            padding: 8px 14px;

            font: inherit;
            font-size: 12px;
            font-weight: 800;

            cursor: pointer;
        }

        .primary-button:hover {
            background: var(--accent);
        }


        /* =========================================================
           RESPONSIVE
           ========================================================= */

        @media (max-width: 900px) {

            :root {
                --panel-width: 190px;
            }

            #brand {
                min-width: auto;
            }

            #brand .brand-text {
                display: none;
            }
        }

        @media (max-width: 700px) {

            #garden-builder {
                grid-template-columns: 1fr;
                grid-template-rows:
                    var(--topbar-height)
                    minmax(0, 1fr)
                    var(--bottom-height);
            }

            #asset-panel,
            #properties-panel {
                display: none;
            }

            #topbar {
                gap: 8px;
            }

            #season-selector {
                overflow-x: auto;
            }

            #canvas-viewport {
                padding-left: 15px;
                padding-right: 15px;
            }

            #garden-canvas {
                width: 800px;
                height: 560px;
            }
        }
    </style>
</head>

<body>

<div id="garden-builder">

    <!-- =========================================================
         TOP BAR
         ========================================================= -->

    <header id="topbar">

        <div id="brand">
            <span>🌱</span>
            <span class="brand-text">Garden Builder</span>
        </div>

        <nav id="season-selector" aria-label="Season">

            <button
                class="season-button active"
                data-season="summer">
                ☀️ Summer
            </button>

            <button
                class="season-button"
                data-season="spring">
                🌱 Spring
            </button>

            <button
                class="season-button"
                data-season="autumn">
                🍂 Autumn
            </button>

            <button
                class="season-button"
                data-season="winter">
                ❄️ Winter
            </button>

        </nav>

    </header>


    <!-- =========================================================
         ASSET PANEL
         ========================================================= -->

    <aside
        id="asset-panel"
        class="side-panel">

        <div class="panel-header">
            🌸 Assets
        </div>

        <div class="panel-content">

            <input
                id="asset-search"
                type="search"
                placeholder="Search assets…"
                autocomplete="off">

            <div id="asset-library">

                <div class="asset-category">

                    <div class="asset-category-title">
                        Flowers
                    </div>

                    <div class="asset-grid">

                        <!-- Temporary placeholders.
                             The real asset manifest will populate this. -->

                        <div class="asset-item">
                            <div style="font-size:32px;">🌸</div>
                            <div class="asset-name">
                                flower
                            </div>
                        </div>

                        <div class="asset-item">
                            <div style="font-size:32px;">🌼</div>
                            <div class="asset-name">
                                flower-yellow
                            </div>
                        </div>

                    </div>

                </div>

                <div class="asset-category">

                    <div class="asset-category-title">
                        Foliage
                    </div>

                    <div class="asset-grid">

                        <div class="asset-item">
                            <div style="font-size:32px;">🍀</div>
                            <div class="asset-name">
                                clover
                            </div>
                        </div>

                        <div class="asset-item">
                            <div style="font-size:32px;">🌿</div>
                            <div class="asset-name">
                                wisteria
                            </div>
                        </div>

                    </div>

                </div>

                <div class="asset-category">

                    <div class="asset-category-title">
                        Creatures
                    </div>

                    <div class="asset-grid">

                        <div class="asset-item">
                            <div style="font-size:32px;">🐝</div>
                            <div class="asset-name">
                                bee
                            </div>
                        </div>

                        <div class="asset-item">
                            <div style="font-size:32px;">🦋</div>
                            <div class="asset-name">
                                butterfly
                            </div>
                        </div>

                    </div>

                </div>

            </div>

        </div>

    </aside>


    <!-- =========================================================
         WORKSPACE
         ========================================================= -->

    <main id="workspace">

        <div id="workspace-toolbar">

            <button
                class="tool-button"
                id="zoom-out"
                title="Zoom out">
                −
            </button>

            <button
                class="tool-button"
                id="zoom-reset"
                title="Reset zoom">
                100%
            </button>

            <button
                class="tool-button"
                id="zoom-in"
                title="Zoom in">
                +
            </button>

            <button
                class="tool-button"
                id="toggle-grid"
                title="Toggle grid">
                Grid
            </button>

        </div>


        <div id="canvas-viewport">

            <div id="garden-canvas">

                <div id="canvas-label">
                    Garden World
                </div>

            </div>

        </div>

    </main>


    <!-- =========================================================
         PROPERTIES PANEL
         ========================================================= -->

    <aside
        id="properties-panel"
        class="side-panel">

        <div class="panel-header">
            ⚙️ Object
        </div>

        <div class="panel-content">

            <div id="no-selection">
                Select an object in the garden to edit its position,
                size, layer, and other properties.
            </div>

            <div
                id="object-properties"
                hidden>

                <div class="property-group">

                    <div class="property-label">
                        <span>Position</span>
                    </div>

                    <div class="property-row">

                        <input
                            id="prop-x"
                            class="property-input"
                            type="number"
                            placeholder="X">

                        <input
                            id="prop-y"
                            class="property-input"
                            type="number"
                            placeholder="Y">

                    </div>

                </div>


                <div class="property-group">

                    <div class="property-label">
                        <span>Scale</span>

                        <span
                            id="scale-value"
                            class="property-value">
                            100%
                        </span>
                    </div>

                    <input
                        id="prop-scale"
                        type="range"
                        min="10"
                        max="300"
                        value="100"
                        style="width:100%;">
                </div>


                <div class="property-group">

                    <div class="property-label">
                        <span>Layer</span>
                    </div>

                    <input
                        id="prop-layer"
                        class="property-input"
                        type="number"
                        value="10">
                </div>


                <div class="property-group">

                    <div class="property-label">
                        <span>Transform</span>
                    </div>

                    <div class="property-button-row">

                        <button
                            id="flip-horizontal"
                            class="property-button">
                            ↔ Flip
                        </button>

                        <button
                            id="duplicate-object"
                            class="property-button">
                            ⧉ Duplicate
                        </button>

                    </div>
                </div>


                <div class="property-group">

                    <button
                        id="delete-object"
                        class="property-button danger-button"
                        style="width:100%;">
                        🗑 Delete Object
                    </button>

                </div>

            </div>

        </div>

    </aside>


    <!-- =========================================================
         BOTTOM BAR
         ========================================================= -->

    <footer id="bottom-bar">

        <div id="viewport-buttons">

            <span
                style="
                    color:var(--muted);
                    font-size:11px;
                    margin-right:4px;
                ">
                Preview:
            </span>

            <button
                class="viewport-button active"
                data-viewport="desktop">
                🖥 Desktop
            </button>

            <button
                class="viewport-button"
                data-viewport="tablet">
                Tablet
            </button>

            <button
                class="viewport-button"
                data-viewport="mobile">
                📱 Phone
            </button>

        </div>


        <div id="bottom-actions">

            <button
                class="viewport-button"
                id="save-layout">
                💾 Save
            </button>

            <button
                class="viewport-button"
                id="load-layout">
                ↻ Load
            </button>

            <button
                class="primary-button"
                id="generate-code">
                ✨ Generate Code
            </button>

        </div>

    </footer>

</div>


<script>
    /* =========================================================
       GARDEN BUILDER — FOUNDATION JS
       ========================================================= */

    const state = {

        season: "summer",

        zoom: 1,

        gridVisible: true,

        viewport: "desktop",

        selectedObject: null,

        objects: {

            summer: [],
            spring: [],
            autumn: [],
            winter: []

        }

    };


    /* =========================================================
       SEASON SWITCHING
       ========================================================= */

    document
        .querySelectorAll(".season-button")
        .forEach(button => {

            button.addEventListener("click", () => {

                document
                    .querySelectorAll(".season-button")
                    .forEach(btn =>
                        btn.classList.remove("active")
                    );

                button.classList.add("active");

                state.season =
                    button.dataset.season;

                state.selectedObject = null;

                console.log(
                    "Active season:",
                    state.season
                );

            });

        });


    /* =========================================================
       ZOOM
       ========================================================= */

    function updateZoom() {

        const canvas =
            document.getElementById("garden-canvas");

        canvas.style.transform =
            `scale(${state.zoom})`;

        document.getElementById("zoom-reset")
            .textContent =
            `${Math.round(state.zoom * 100)}%`;
    }


    document
        .getElementById("zoom-in")
        .addEventListener("click", () => {

            state.zoom =
                Math.min(
                    2,
                    state.zoom + 0.1
                );

            updateZoom();

        });


    document
        .getElementById("zoom-out")
        .addEventListener("click", () => {

            state.zoom =
                Math.max(
                    0.5,
                    state.zoom - 0.1
                );

            updateZoom();

        });


    document
        .getElementById("zoom-reset")
        .addEventListener("click", () => {

            state.zoom = 1;

            updateZoom();

        });


    /* =========================================================
       GRID
       ========================================================= */

    document
        .getElementById("toggle-grid")
        .addEventListener("click", () => {

            state.gridVisible =
                !state.gridVisible;

            document
                .getElementById("garden-canvas")
                .classList.toggle(
                    "grid-hidden",
                    !state.gridVisible
                );

        });


    /* =========================================================
       VIEWPORT PRESETS
       ========================================================= */

    document
        .querySelectorAll(".viewport-button[data-viewport]")
        .forEach(button => {

            button.addEventListener("click", () => {

                document
                    .querySelectorAll(
                        ".viewport-button[data-viewport]"
                    )
                    .forEach(btn =>
                        btn.classList.remove("active")
                    );

                button.classList.add("active");

                state.viewport =
                    button.dataset.viewport;

                console.log(
                    "Preview:",
                    state.viewport
                );

            });

        });


    /* =========================================================
       SAVE
       ========================================================= */

    document
        .getElementById("save-layout")
        .addEventListener("click", () => {

            localStorage.setItem(
                "gardenBuilderLayouts",
                JSON.stringify(state.objects)
            );

            alert("Garden layouts saved!");

        });


    /* =========================================================
       LOAD
       ========================================================= */

    document
        .getElementById("load-layout")
        .addEventListener("click", () => {

            const saved =
                localStorage.getItem(
                    "gardenBuilderLayouts"
                );

            if (!saved) {

                alert("No saved garden layouts found.");

                return;
            }

            try {

                state.objects =
                    JSON.parse(saved);

                alert("Garden layouts loaded!");

            } catch (error) {

                console.error(error);

                alert(
                    "The saved garden data could not be loaded."
                );

            }

        });


    /* =========================================================
       CODE GENERATOR — PLACEHOLDER
       ========================================================= */

    document
        .getElementById("generate-code")
        .addEventListener("click", () => {

            console.log(
                "Garden layout:",
                state.objects
            );

            alert(
                "Code generation is coming next! 🌱"
            );

        });


    /* =========================================================
       INITIALIZE
       ========================================================= */

    updateZoom();

</script>

</body>
</html>
